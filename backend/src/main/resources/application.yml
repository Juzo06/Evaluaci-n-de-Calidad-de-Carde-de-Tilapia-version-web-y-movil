spring:
  application:
    name: secct
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/secct}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate        # el esquema lo gestiona Flyway; Hibernate solo lo valida
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    # Supabase trae esquemas propios: si el schema no está vacío, Flyway
    # crea una línea base en la versión 0 y aun así ejecuta V1, V2, ...
    baseline-on-migrate: true
    baseline-version: 0

secct:
  zona-horaria: America/Bogota   # se usará en el Paso 2 para validar "fecha de captura no futura"
  cnn:
    url: ${CNN_URL:http://localhost:8000}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

logging:
  file:
    name: logs/secct.log
  level:
    co.unillanos.secct: INFO
